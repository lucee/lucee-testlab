# testlab-maven: caching mirror of Maven Central over plain http
# Only reachable by name inside the docker network (via squid), plus a published port for the no-proxy control.
# Everything is cached forever (metadata too), so runs are repeatable and Central is hit once per file.
proxy_cache_path /var/cache/nginx/maven levels=1:2 keys_zone=maven:10m max_size=4g inactive=3650d use_temp_path=off;

# client is a squid container when proxied, the docker gateway when direct
log_format testlab '$remote_addr "$request" $status $upstream_cache_status';

server {
	listen 80;
	access_log /dev/stdout testlab;

	location /maven2/ {
		proxy_pass https://repo1.maven.org/maven2/;
		proxy_ssl_server_name on;
		proxy_set_header Host repo1.maven.org;
		proxy_http_version 1.1;

		proxy_cache maven;
		proxy_cache_key $uri;
		proxy_cache_valid 200 3650d;
		proxy_cache_valid 404 1d;
		proxy_cache_use_stale error timeout updating;
		proxy_cache_lock on;
		proxy_ignore_headers Set-Cookie Cache-Control Expires;
		proxy_hide_header Set-Cookie;

		# same shape as Cloudflare's __cf_bm on Central: HttpClient 4's default cookie spec rejects
		# the RFC 1123 Expires and logs "Invalid cookie header" at WARN
		add_header Set-Cookie "__cf_bm=testlab; HttpOnly; SameSite=None; Secure; Path=/; Expires=Wed, 14 Oct 2099 10:49:10 GMT" always;
		add_header X-Testlab-Cache $upstream_cache_status always;
	}
}
