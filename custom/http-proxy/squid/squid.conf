# plain squid, no auth
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow all
http_port 3128
access_log stdio:/var/log/squid/access.log
cache deny all
# lets the target (httpbin /anything) see which proxy carried the request
request_header_add X-Testlab-Proxy squid
