# basic-auth squid for the proxy credentials checks, user lucee / secret (passwd)
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm testlab-squid-auth
acl authed proxy_auth REQUIRED
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow authed
http_access deny all
http_port 3128
access_log stdio:/var/log/squid/access.log
cache deny all
# lets the target (httpbin /anything) see which proxy carried the request
request_header_add X-Testlab-Proxy squid-auth
