name: HTTP Proxy

# report-only: does Lucee's HTTP traffic go through the configured proxy, see custom/http-proxy/README.md

on:
  push:
    paths:
      - custom/http-proxy/**
      - .github/workflows/http-proxy.yml
  workflow_dispatch:
    inputs:
      lucee_versions:
        required: false
        description: Lucee Versions (json)
        default: '[ "6.2/snapshot/jar", "7.0/snapshot/jar", "7.1/snapshot/jar", "8.0/snapshot/jar" ]'
        type: string
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        luceeVersion: ${{ fromJSON( github.event.inputs.lucee_versions || '[ "6.2/snapshot/jar", "7.0/snapshot/jar", "7.1/snapshot/jar", "8.0/snapshot/jar" ]' ) }}
    env:
      SCRIPT_RUNNER: ${{ github.workspace }}/script-runner
      MAVEN_CACHE_DIR: ${{ github.workspace }}/maven-mirror-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout script-runner
        uses: actions/checkout@v7
        with:
          repository: lucee/script-runner
          path: script-runner
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Lucee files
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/script-runner/lucee-download-cache
          key: lucee-downloads-http-proxy-${{ github.run_id }}
          restore-keys: lucee-downloads-http-proxy-
      # the fake Maven's cache, so Central sees each file once
      - name: Cache Maven mirror
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/maven-mirror-cache
          key: http-proxy-maven-mirror-${{ github.run_id }}
          restore-keys: http-proxy-maven-mirror-

      - name: Proxy scenarios (.CFConfig.json)
        working-directory: custom/http-proxy
        run: |
          for scenario in none good auth wrongpass nocreds deadport badhost; do
            ./run.sh ${{ matrix.luceeVersion }} $scenario
          done

      - name: Config sources (good proxy)
        if: always()
        working-directory: custom/http-proxy
        run: |
          for source in baseconfig context env env-vs-cfconfig app; do
            SOURCE=$source ./run.sh ${{ matrix.luceeVersion }} good
          done

      - name: Summary
        if: always()
        run: |
          echo "## ${{ matrix.luceeVersion }}" >> $GITHUB_STEP_SUMMARY
          ./custom/http-proxy/summary.sh >> $GITHUB_STEP_SUMMARY

      # nginx writes its cache as its own user, readable only by it
      - name: Make the mirror cache readable
        if: always()
        run: sudo chmod -R a+rX ${{ github.workspace }}/maven-mirror-cache

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: http-proxy-${{ strategy.job-index }}
          path: |
            test-output/http-proxy
            !test-output/http-proxy/**/work
            !test-output/http-proxy/**/home
